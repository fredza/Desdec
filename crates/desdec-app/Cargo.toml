[package]
name = "desdec-app"
version = "0.3.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
desdec-core = { path = "../desdec-core" }
eframe = { version = "0.31", features = ["persistence"] }
pollster = "0.4"
rfd = "0.15"
# The scripting engine: pure Rust, and sandboxed by construction — it reaches
# nothing the host does not hand it, so a script can read the analysis and ask
# for annotations without ever seeing a file system or a process.
rhai = "1.25"
# The reader's own notes are written in the same format the preferences use,
# and so are the plugin manifests.
ron = "0.8"
serde = { version = "1", features = ["derive"] }
# The wall clock, for the session's account. `local-offset` is what turns UTC
# into the reader's own time; it is read once in `main`, before any thread
# exists, which is the only moment the library will answer.
time = { version = "0.3", features = ["local-offset"] }

[dev-dependencies]
# Synthetic ELF, PE and Mach-O binaries, so the interface tests do not depend
# on the format and architecture of the machine they happen to run on.
desdec-core = { path = "../desdec-core", features = ["fixtures"] }

[lints]
workspace = true
