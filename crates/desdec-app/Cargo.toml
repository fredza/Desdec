[package]
name = "desdec-app"
version = "0.2.4"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
desdec-core = { path = "../desdec-core" }
eframe = { version = "0.31", features = ["persistence"] }
pollster = "0.4"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# Synthetic ELF, PE and Mach-O binaries, so the interface tests do not depend
# on the format and architecture of the machine they happen to run on.
desdec-core = { path = "../desdec-core", features = ["fixtures"] }
# Same format eframe uses for its native storage file.
ron = "0.8"

[lints]
workspace = true
