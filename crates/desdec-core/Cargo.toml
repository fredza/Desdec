[package]
name = "desdec-core"
version = "0.2.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Synthetic binaries shared with the interface tests. Off by default: nothing
# in a shipped build has any use for them.
fixtures = []

[lints]
workspace = true

[dependencies]
capstone = { version = "0.14", default-features = false, features = ["std", "full", "arch_arm64"] }
iced-x86 = { version = "1.21", features = ["decoder", "gas"] }
serde_json = "1.0.151"
ureq = { version = "3.4.0", default-features = false, features = ["json", "rustls", "gzip"] }
