name: Platform binaries

on:
  workflow_dispatch:
  # Nothing was built between v0.2.2 and v0.3.0 — three days and forty-one
  # commits — because this ran on tags alone. Two defects lived in `main` that
  # whole time and were found by a release refusing to publish: a test that
  # assumed a Windows executable names functions, and a publish step deleting
  # the archives it was about to attach. Neither needed a tag to be visible,
  # only a build. So every commit that reaches `main` is built on all three
  # platforms, and a tag only ever ships something already known to compile
  # and pass its tests somewhere other than the author's machine.
  #
  # This is affordable because the repository is public: minutes on the
  # standard runners are not billed. It was not, while it was private — one
  # full run cost 315 billed minutes of the 2 000 a month included, Linux
  # counting once, Windows twice and macOS ten times.
  push:
    branches:
      - main
    tags:
      # Both spellings. Releases 0.4.12 and 0.4.13 were named without the
      # leading `v`, this filter did not match them, the job never ran, and
      # they went out carrying one bare executable instead of the three
      # archives and their checksums — which is exactly the state
      # `scripts/install.sh` cannot install from. A tag naming a version
      # publishes a release whichever way it is spelled.
      - "v[0-9]*"
      - "[0-9]*"
  # And weekly even when nothing has changed here, because not everything
  # that breaks a build is a commit: `stable` moves, a runner image is
  # replaced, a dependency yanks a version. Those arrive on their own schedule
  # and would otherwise be discovered by whoever tags next.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# Every action here runs on Node 24. They were pinned to majors that ship a
# Node 20 entry point, which the runners now refuse to honour: they force
# those actions onto Node 24 and say so in an annotation on every job. Running
# a Node 20 bundle on a runtime it was not built for is not something to leave
# a release depending on, and the deprecation ends with the runners dropping
# Node 20 outright. Every input this workflow passes exists unchanged in the
# major it was moved to — `pattern` and `merge-multiple` on the download,
# `if-no-files-found` on the uploads, and all five inputs of the release step.

jobs:
  # The About dialog shows the crate version, while the release is named by the
  # tag. Nothing tied the two together, so a tag could ship a binary announcing
  # a different version — v0.1.1 was released from a crate still saying 0.1.0.
  # This runs first and takes seconds, so a mismatch is caught before three
  # fifteen-minute builds rather than after them.
  version:
    name: Tag matches the crate version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Every tag, not just the ones spelled with a `v`. Guarded on `v` alone,
      # this check waved through exactly the tags that most needed it: a
      # release named `0.4.14` skipped it entirely and could have shipped a
      # binary reporting some other version. `${GITHUB_REF_NAME#v}` strips the
      # prefix when it is there and leaves the name alone when it is not.
      - name: Compare the tag with Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          crate="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "desdec-app"))')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$crate" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME ships a binary that reports v$crate."
            echo "::error::Set version = \"$tag\" in crates/desdec-app/Cargo.toml and crates/desdec-core/Cargo.toml, then retag."
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME and crate v$crate agree"

  linux-x86_64:
    name: Linux x86_64
    needs: version
    # Where this job runs, and how to move it without editing this file.
    #
    # `LINUX_RUNNER` is a repository variable. Unset — which it is until
    # somebody sets it — this reads `ubuntu-24.04` and nothing changes. Set to
    # a self-hosted runner's labels, the job goes there instead:
    #
    #     gh variable set LINUX_RUNNER --body '["self-hosted","desdec-linux"]'
    #     gh variable delete LINUX_RUNNER          # and back to GitHub's
    #
    # A variable rather than a value written in here, because a self-hosted
    # runner is a machine somebody owns: it gets turned off, it goes on
    # holiday, its disk fills up. A job pinned to one that is not listening
    # does not fail — it queues, for twenty-four hours, and then fails. Pinning
    # it here would mean a release blocked behind a laptop, and an edit to this
    # file plus a new tag to get out of it. A variable is one command, from
    # anywhere, and it takes effect on the next run.
    #
    # The variable holds **JSON**, because `runs-on` takes either one label or
    # an array of them and a self-hosted runner is usually named by several.
    # A bare `self-hosted` is not JSON and will not parse; `"self-hosted"` is.
    #
    # `fromJSON` is given something valid whichever way this goes, rather than
    # being guarded by the `&&` in front of it. Whether these operators
    # short-circuit decides, in the guarded spelling, between reading the
    # variable and calling `fromJSON('')` — and that call is an error that
    # fails the job before a line of it runs. Written this way the question
    # does not arise: the fallback is itself a JSON string, so there is no
    # spelling of the variable, empty included, that reaches `fromJSON` with
    # something it cannot read.
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-24.04"') }}
    env:
      # rust-cache restores whole dependency trees between jobs.  sccache adds
      # the smaller-grained layer: it reuses rustc outputs when only an
      # unrelated crate or a workflow step changed.
      #
      # Both are GitHub's own cache service, which a self-hosted runner reaches
      # exactly like a hosted one. They earn much less there — the disk already
      # holds `target/` and `~/.cargo` from the last run — but they cost
      # nothing to leave on, and turning them off would slow the first run
      # after the runner is replaced or its disk is cleared.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      # `clean: true` is the default and stays: a self-hosted runner keeps its
      # working directory between runs, so a file left behind by a build — or
      # by somebody's pull request — would otherwise still be there for the
      # next one.
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Cache Rust compiler outputs
        uses: mozilla-actions/sccache-action@v0.0.11
      # Every job here compiled the whole dependency tree from nothing, twice
      # over — capstone, iced-x86, eframe, rhai — and then the workspace in
      # debug for the tests and again in release for the artifact. That is
      # where the fifty-five minutes went, and none of it changes between one
      # tag and the next.
      #
      # The cache is keyed by job, target and lockfile, so a dependency that
      # really did change is rebuilt and one that did not is restored. The
      # workspace's own crates are deliberately not cached: they change every
      # time, and restoring a stale `desdec-core` is how a release ships code
      # nobody wrote.
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --locked --release -p desdec-app --target x86_64-unknown-linux-gnu
      # The desktop entry travels with the binary. `scripts/install.sh` had no
      # way to give a downloaded Desdec an icon and a menu entry: it does not
      # have the repository in front of it, and the archive did not carry the
      # one file it needed. It now reads `Desdec.desktop` out of the archive,
      # and falls back to fetching it at the installed tag for the releases
      # published before this line existed.
      #
      # The second `-C` is absolute on purpose: tar reads each of them
      # relative to where the previous one left it, so a relative path here
      # would be looked for under `target/`.
      - name: Archive release executable and checksum
        run: |
          tar -czf desdec-linux-x86_64-release.tar.gz \
            -C target/x86_64-unknown-linux-gnu/release desdec-app \
            -C "$GITHUB_WORKSPACE/packaging" Desdec.desktop
          sha256sum desdec-linux-x86_64-release.tar.gz > desdec-linux-x86_64-release.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: desdec-linux-x86_64-release
          path: |
            desdec-linux-x86_64-release.tar.gz
            desdec-linux-x86_64-release.tar.gz.sha256
          if-no-files-found: error

  windows-x86_64:
    name: Windows x86_64
    needs: version
    runs-on: windows-2025
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust compiler outputs
        uses: mozilla-actions/sccache-action@v0.0.11
      # Every job here compiled the whole dependency tree from nothing, twice
      # over — capstone, iced-x86, eframe, rhai — and then the workspace in
      # debug for the tests and again in release for the artifact. That is
      # where the fifty-five minutes went, and none of it changes between one
      # tag and the next.
      #
      # The cache is keyed by job, target and lockfile, so a dependency that
      # really did change is rebuilt and one that did not is restored. The
      # workspace's own crates are deliberately not cached: they change every
      # time, and restoring a stale `desdec-core` is how a release ships code
      # nobody wrote.
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --locked -p desdec-app --target x86_64-pc-windows-msvc
      - name: Archive debug executable
        shell: pwsh
        run: Compress-Archive -Path target\x86_64-pc-windows-msvc\debug\desdec-app.exe -DestinationPath desdec-windows-x86_64-debug.zip
      - uses: actions/upload-artifact@v7
        with:
          name: desdec-windows-x86_64-debug
          path: desdec-windows-x86_64-debug.zip
          if-no-files-found: error
      - run: cargo build --locked --release -p desdec-app --target x86_64-pc-windows-msvc
      - name: Archive release executable
        shell: pwsh
        run: |
          Compress-Archive -Path target\x86_64-pc-windows-msvc\release\desdec-app.exe -DestinationPath desdec-windows-x86_64-release.zip
          $hash = (Get-FileHash desdec-windows-x86_64-release.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  desdec-windows-x86_64-release.zip" | Set-Content -NoNewline desdec-windows-x86_64-release.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: desdec-windows-x86_64-release
          path: |
            desdec-windows-x86_64-release.zip
            desdec-windows-x86_64-release.zip.sha256
          if-no-files-found: error

  macos-arm64:
    name: macOS ARM64
    needs: version
    runs-on: macos-15
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Cache Rust compiler outputs
        uses: mozilla-actions/sccache-action@v0.0.11
      # Every job here compiled the whole dependency tree from nothing, twice
      # over — capstone, iced-x86, eframe, rhai — and then the workspace in
      # debug for the tests and again in release for the artifact. That is
      # where the fifty-five minutes went, and none of it changes between one
      # tag and the next.
      #
      # The cache is keyed by job, target and lockfile, so a dependency that
      # really did change is rebuilt and one that did not is restored. The
      # workspace's own crates are deliberately not cached: they change every
      # time, and restoring a stale `desdec-core` is how a release ships code
      # nobody wrote.
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --locked -p desdec-app --target aarch64-apple-darwin
      - name: Archive debug executable
        run: ditto -c -k --sequesterRsrc --keepParent target/aarch64-apple-darwin/debug/desdec-app desdec-macos-aarch64-debug.zip
      - uses: actions/upload-artifact@v7
        with:
          name: desdec-macos-aarch64-debug
          path: desdec-macos-aarch64-debug.zip
          if-no-files-found: error
      - run: cargo build --locked --release -p desdec-app --target aarch64-apple-darwin
      - name: Archive release executable
        run: |
          ditto -c -k --sequesterRsrc --keepParent target/aarch64-apple-darwin/release/desdec-app desdec-macos-aarch64-release.zip
          shasum -a 256 desdec-macos-aarch64-release.zip > desdec-macos-aarch64-release.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: desdec-macos-aarch64-release
          path: |
            desdec-macos-aarch64-release.zip
            desdec-macos-aarch64-release.zip.sha256
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [linux-x86_64, windows-x86_64, macos-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # No checkout, and that is deliberate. `actions/checkout` cleans the
      # directory it lands in, and the artifacts land in that same directory:
      # run the two the wrong way round and it deletes the archives between
      # downloading them and publishing them. v0.3.0 was published with
      # nothing in it, and the job went green. Nothing from the repository is
      # attached any more, so the surest way not to repeat that is to have
      # nothing to check out.
      - uses: actions/download-artifact@v8
        with:
          pattern: desdec-*-release
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          append_body: true
          # A named file that is not there is the failure this job exists to
          # avoid, and it must stop the release rather than shrink it.
          fail_on_unmatched_files: true
          # Releases are no longer signed. Everything published here answers
          # one question — whether the download is intact — and says so
          # plainly, rather than implying a second answer it does not have.
          # Archives up to v0.4.0 were signed and keep their `.asc` files.
          body: |
            Each archive has a `.sha256` beside it, which says the download
            arrived intact:

            ```
            sha256sum --check desdec-linux-x86_64-release.tar.gz.sha256
            ```

            Releases are not signed from v0.4.1 on. Up to v0.4.0 they were,
            and those archives keep their detached `.asc` signatures.
          files: |
            desdec-linux-x86_64-release.tar.gz
            desdec-linux-x86_64-release.tar.gz.sha256
            desdec-windows-x86_64-release.zip
            desdec-windows-x86_64-release.zip.sha256
            desdec-macos-aarch64-release.zip
            desdec-macos-aarch64-release.zip.sha256
