name: Platform binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  # Nothing was built between v0.2.2 and v0.3.0 — three days and forty-one
  # commits — because this ran on tags alone. Two defects lived in `main` that
  # whole time and were found by a release refusing to publish: a test that
  # assumed a Windows executable names functions, and a publish step deleting
  # the archives it was about to attach. Neither needed a tag to be visible,
  # only a build.
  #
  # Weekly rather than per-push, and without macOS, because this repository is
  # private and its minutes are billed: Linux counts once, Windows twice and
  # macOS ten times, which made one full run of v0.3.0 cost 315 billed minutes
  # of the 2 000 a month included. A week of blindness costs a fraction of
  # that; three days of it cost a release.
  #
  # If this repository is ever made public, minutes stop being billed and this
  # should become `push: branches: [main]` with all three platforms.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  # The About dialog shows the crate version, while the release is named by the
  # tag. Nothing tied the two together, so a tag could ship a binary announcing
  # a different version — v0.1.1 was released from a crate still saying 0.1.0.
  # This runs first and takes seconds, so a mismatch is caught before three
  # fifteen-minute builds rather than after them.
  version:
    name: Tag matches the crate version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compare the tag with Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          crate="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "desdec-app"))')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$crate" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME ships a binary that reports v$crate."
            echo "::error::Set version = \"$tag\" in crates/desdec-app/Cargo.toml and crates/desdec-core/Cargo.toml, then retag."
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME and crate v$crate agree"

  linux-x86_64:
    name: Linux x86_64
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      # Every job here compiled the whole dependency tree from nothing, twice
      # over — capstone, iced-x86, eframe, rhai — and then the workspace in
      # debug for the tests and again in release for the artifact. That is
      # where the fifty-five minutes went, and none of it changes between one
      # tag and the next.
      #
      # The cache is keyed by job, target and lockfile, so a dependency that
      # really did change is rebuilt and one that did not is restored. The
      # workspace's own crates are deliberately not cached: they change every
      # time, and restoring a stale `desdec-core` is how a release ships code
      # nobody wrote.
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --locked --release -p desdec-app --target x86_64-unknown-linux-gnu
      - name: Archive release executable and checksum
        run: |
          tar -C target/x86_64-unknown-linux-gnu/release -czf desdec-linux-x86_64-release.tar.gz desdec-app
          sha256sum desdec-linux-x86_64-release.tar.gz > desdec-linux-x86_64-release.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: desdec-linux-x86_64-release
          path: |
            desdec-linux-x86_64-release.tar.gz
            desdec-linux-x86_64-release.tar.gz.sha256
          if-no-files-found: error

  windows-x86_64:
    name: Windows x86_64
    needs: version
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      # Every job here compiled the whole dependency tree from nothing, twice
      # over — capstone, iced-x86, eframe, rhai — and then the workspace in
      # debug for the tests and again in release for the artifact. That is
      # where the fifty-five minutes went, and none of it changes between one
      # tag and the next.
      #
      # The cache is keyed by job, target and lockfile, so a dependency that
      # really did change is rebuilt and one that did not is restored. The
      # workspace's own crates are deliberately not cached: they change every
      # time, and restoring a stale `desdec-core` is how a release ships code
      # nobody wrote.
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --locked -p desdec-app --target x86_64-pc-windows-msvc
      - name: Archive debug executable
        shell: pwsh
        run: Compress-Archive -Path target\x86_64-pc-windows-msvc\debug\desdec-app.exe -DestinationPath desdec-windows-x86_64-debug.zip
      - uses: actions/upload-artifact@v4
        with:
          name: desdec-windows-x86_64-debug
          path: desdec-windows-x86_64-debug.zip
          if-no-files-found: error
      - run: cargo build --locked --release -p desdec-app --target x86_64-pc-windows-msvc
      - name: Archive release executable
        shell: pwsh
        run: |
          Compress-Archive -Path target\x86_64-pc-windows-msvc\release\desdec-app.exe -DestinationPath desdec-windows-x86_64-release.zip
          $hash = (Get-FileHash desdec-windows-x86_64-release.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  desdec-windows-x86_64-release.zip" | Set-Content -NoNewline desdec-windows-x86_64-release.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: desdec-windows-x86_64-release
          path: |
            desdec-windows-x86_64-release.zip
            desdec-windows-x86_64-release.zip.sha256
          if-no-files-found: error

  macos-arm64:
    name: macOS ARM64
    needs: version
    # Ten billed minutes for every minute it runs, and not once the platform
    # that caught something. It builds for a release and when asked, not on
    # the weekly check.
    if: github.event_name != 'schedule'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      # Every job here compiled the whole dependency tree from nothing, twice
      # over — capstone, iced-x86, eframe, rhai — and then the workspace in
      # debug for the tests and again in release for the artifact. That is
      # where the fifty-five minutes went, and none of it changes between one
      # tag and the next.
      #
      # The cache is keyed by job, target and lockfile, so a dependency that
      # really did change is rebuilt and one that did not is restored. The
      # workspace's own crates are deliberately not cached: they change every
      # time, and restoring a stale `desdec-core` is how a release ships code
      # nobody wrote.
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --locked -p desdec-app --target aarch64-apple-darwin
      - name: Archive debug executable
        run: ditto -c -k --sequesterRsrc --keepParent target/aarch64-apple-darwin/debug/desdec-app desdec-macos-aarch64-debug.zip
      - uses: actions/upload-artifact@v4
        with:
          name: desdec-macos-aarch64-debug
          path: desdec-macos-aarch64-debug.zip
          if-no-files-found: error
      - run: cargo build --locked --release -p desdec-app --target aarch64-apple-darwin
      - name: Archive release executable
        run: |
          ditto -c -k --sequesterRsrc --keepParent target/aarch64-apple-darwin/release/desdec-app desdec-macos-aarch64-release.zip
          shasum -a 256 desdec-macos-aarch64-release.zip > desdec-macos-aarch64-release.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: desdec-macos-aarch64-release
          path: |
            desdec-macos-aarch64-release.zip
            desdec-macos-aarch64-release.zip.sha256
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [linux-x86_64, windows-x86_64, macos-arm64]
    # Only ever reached from a tag, where all three have run.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The checkout comes first, and must stay first. `actions/checkout`
      # cleans the working directory it lands in, and the artifacts land in
      # that same directory: run the other way round, it deletes all three
      # archives between downloading them and publishing them. v0.3.0 was
      # published with nothing in it but the key, and the job went green.
      #
      # The public half of the signing key travels with the binaries, so a
      # reader has both halves of the check without hunting for either. The
      # private half is never here: it stays on the maintainer's machine, and
      # `scripts/sign-release.sh` attaches the signatures afterwards. A key a
      # build service holds is a key whoever reaches that service holds.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: desdec-signing-key.asc
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          pattern: desdec-*-release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          append_body: true
          # A named file that is not there is the failure this job exists to
          # avoid, and it must stop the release rather than shrink it.
          fail_on_unmatched_files: true
          body: |
            Signed by **Frédéric Zawalski @2026 bdom** —
            key `C9A3 1D07 46E0 65C4 E2EA  33F6 08FA 1D81 8A91 F329`.

            The signatures are attached as `.asc` files next to each archive,
            and the public key as `desdec-signing-key.asc`. To check one:

            ```
            gpg --import desdec-signing-key.asc
            gpg --verify desdec-linux-x86_64-release.tar.gz.asc \
                         desdec-linux-x86_64-release.tar.gz
            ```

            The `.sha256` files answer a different question: they say the
            download is intact, not who made it.
          files: |
            desdec-signing-key.asc
            desdec-linux-x86_64-release.tar.gz
            desdec-linux-x86_64-release.tar.gz.sha256
            desdec-windows-x86_64-release.zip
            desdec-windows-x86_64-release.zip.sha256
            desdec-macos-aarch64-release.zip
            desdec-macos-aarch64-release.zip.sha256
